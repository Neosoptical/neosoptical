
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>NEOS Optical | Ottica a Chiaravalle</title>

  <meta name="description"
        content="NEOS Optical, negozio di ottica a Chiaravalle (AN). Via Maestri del Lavoro 17. Tel. 071 9945179.">

  <meta name="robots" content="index, follow">
  <link rel="canonical"
        href="https://neosoptical.it/">
  <meta name="theme-color" content="#ffffff">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Optician",
    "name": "NEOS Optical",
    "url": "https://neosoptical.it/",
    "telephone": "+390719945179",
    "email": "info@neosoptical.it",
    "logo": "https://neosoptical.it/logo-neos.png",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Via Maestri del Lavoro 17",
      "postalCode": "60033",
      "addressLocality": "Chiaravalle",
      "addressRegion": "AN",
      "addressCountry": "IT"
    }
  }
  </script>

  <style>
    :root {
      --ice: #8bbfce;
      --ink: #263942;
      --muted: #73838a;
      --line: #e4edf0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: var(--ink);
      font-family: "Helvetica Neue",
                   Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 24px 30px;
    }

    .content {
      width: 100%;
      max-width: 600px;
      text-align: center;
      margin: auto 0;
    }

    .logo {
      display: block;
      width: min(100%, 380px);
      height: auto;
      margin: 0 auto 36px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      margin: 0 0 30px;
    }

    .divider {
      width: 52px;
      height: 1px;
      background: var(--ice);
      margin: 0 auto 32px;
    }

    address {
      font-size: 17px;
      font-style: normal;
      line-height: 2;
      font-weight: 300;
    }

    .contact {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .contact a {
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
    }

    .contact a:hover {
      color: #438ba1;
    }

    .maps {
      display: inline-block;
      margin-top: 34px;
      padding: 14px 32px;
      border: 1px solid var(--ice);
      color: #397e94;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.17em;
      font-size: 11px;
      transition: 0.2s ease;
    }

    .maps:hover {
      background: var(--ice);
      color: #ffffff;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin-top: 48px;
    }

    .social a {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 5px;
    }

    .social a:hover {
      color: #397e94;
      border-color: var(--ice);
    }

    footer {
      width: 100%;
      text-align: center;
      border-top: 1px solid var(--line);
      padding-top: 24px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .page {
        padding: 45px 22px 25px;
      }

      .logo {
        width: min(100%, 290px);
      }

      address {
        font-size: 15px;
      }

      .social {
        gap: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <main class="content">

      <img
        src="logo-neos.png"
        alt="NEOS Optical - Ottica a Chiaravalle"
        class="logo">

      <h1 class="eyebrow">
        Ottica a Chiaravalle
      </h1>

      <div class="divider"></div>

      <address>
        Via Maestri del Lavoro 17<br>
        60033 Chiaravalle (AN)<br>
        Italia
      </address>

      <div class="contact">
        <a href="tel:+390719945179">
          071 9945179
        </a>

        <a href="mailto:info@neosoptical.it">
          info@neosoptical.it
        </a>
      </div>

      <a class="maps"
         href="https://www.google.com/maps/search/?api=1&amp;query=Via+Maestri+del+Lavoro+17+Chiaravalle+AN"
         target="_blank"
         rel="noopener noreferrer">
        Come raggiungerci
      </a>

      <nav class="social" aria-label="Social network">
        <a href="https://www.instagram.com/"
           target="_blank"
           rel="noopener noreferrer">
          Instagram
        </a>

        <a href="https://www.facebook.com/"
           target="_blank"
           rel="noopener noreferrer">
          Facebook
        </a>
      </nav>

    </main>

    <footer>
      © NEOS OPTICAL · CHIARAVALLE
    </footer>

  </div>

</body>
</html>
