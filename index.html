
<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#ffffff">

  <!-- Anteprima social -->
  <meta property="og:type" content="website">
  <meta property="og:title"
        content="NEOS Optical | Ottica a Chiaravalle">
  <meta property="og:description"
        content="NEOS Optical - Via Maestri del Lavoro 17, 60033 Chiaravalle (AN).">
  <meta property="og:url"
        content="https://neosoptical.it/">
  <meta property="og:image"
        content="https://neosoptical.it/logo-neos.png">

  <!-- Dati strutturati Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Optician",
    "name": "NEOS Optical",
    "url": "https://neosoptical.it/",
    "logo": "https://neosoptical.it/logo-neos.png",
    "telephone": "+390719945179",
    "email": "info@neosoptical.it",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Via Maestri del Lavoro 17",
      "postalCode": "60033",

      "addressRegion": "AN",
      "addressCountry": "IT"

    "sameAs": [
      "https://www.instagram.com/neosoptical/",
      "https://www.facebook.com/profile.php?id=61591669449663"
    ]

  <style>

    :root {
      --ice: #8bbfce;
      --ice-dark: #498da3;
      --ink: #263942;
      --muted: #73838a;
      --line: #e4edf0;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--white);
      color: var(--ink);
      font-family: "Helvetica Neue",
                   Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 24px 28px;
    }

    .content {
      width: 100%;
      max-width: 600px;
      margin: auto 0;
      text-align: center;
    }

    /* LOGO ORIGINALE */

    .logo {
      display: block;
      width: min(100%, 380px);
      height: auto;
      margin: 0 auto 38px;
      object-fit: contain;
    }

    /* SOTTOTITOLO */

    .eyebrow {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.30em;
      text-transform: uppercase;
    }

    /* LINEA DECORATIVA */

    .divider {
      width: 55px;
      height: 1px;
      background: var(--ice);
      margin: 0 auto 34px;
    }

    /* INDIRIZZO */

    address {
      font-size: 17px;
      font-style: normal;
      line-height: 2;
      font-weight: 300;
      color: var(--ink);
    }

    /* CONTATTI */

    .contact {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .contact a {
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      transition: color 0.2s ease;
    }

    .contact a:hover {
      color: var(--ice-dark);
    }

    /* PULSANTE GOOGLE MAPS */

    .maps {
      display: inline-block;
      margin-top: 38px;
      padding: 15px 34px;
      border: 1px solid var(--ice);
      color: var(--ice-dark);
      background: transparent;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .maps:hover {
      background: var(--ice);
      color: var(--white);
    }

    /* SOCIAL NETWORK */

    .social {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 38px;
      margin-top: 48px;
    }

    .social a {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 6px;
      transition: all 0.2s ease;
    }

    .social a:hover {
      color: var(--ice-dark);
      border-bottom-color: var(--ice);
    }

    /* FOOTER */

    footer {
      width: 100%;
      margin-top: 60px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    /* SMARTPHONE */

    @media (max-width: 600px) {

      .page {
        padding: 45px 22px 25px;
      }

      .logo {
        width: min(100%, 290px);
        margin-bottom: 30px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.20em;
      }

      address {
        font-size: 15px;
      }

      .contact a {
        font-size: 14px;
      }

      .social {
        gap: 26px;
      }

      .social a {
        font-size: 11px;
      }

      footer {
        font-size: 10px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <main class="content">

      <!-- LOGO NEOS OPTICAL -->
      <img
        src="logo-neos.png"
        alt="NEOS Optical - Negozio di ottica a Chiaravalle"
        class="logo"
        width="380">

      <!-- PRESENTAZIONE -->
      <h1 class="eyebrow">
        Ottica a Chiaravalle
      </h1>

      <div class="divider"></div>

      <!-- INDIRIZZO -->
      <address>
        Via Maestri del Lavoro 17<br>
        Parco La Manifattura<br>
        60033 Chiaravalle (AN)<br>
        Italia
      </address>

      <!-- TELEFONO ED EMAIL -->
      <div class="contact">

        <a href="tel:+390719945179">
          071 9945179
        </a>

        <a href="mailto:info@neosoptical.it">
          info@neosoptical.it
        </a>

      </div>

      <!-- GOOGLE MAPS -->
      <a
        class="maps"
        href="https://www.google.com/maps/search/?api=1&amp;query=Via+Maestri+del+Lavoro+17+Chiaravalle+AN"
        target="_blank"
        rel="noopener noreferrer">
        Come raggiungerci
      </a>

      <!-- SOCIAL NETWORK -->
      <nav class="social" aria-label="Social network">

        <a
          href="https://www.instagram.com/neosoptical/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="NEOS Optical su Instagram">
          Instagram
        </a>

        <a
          href="https://www.facebook.com/profile.php?id=61591669449663"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="NEOS Optical su Facebook">
          Facebook
        </a>

      </nav>

    </main>

    <!-- FOOTER -->
    <footer>
      © NEOS OPTICAL · CHIARAVALLE
    </footer>

  </div>

</body>
</html>
